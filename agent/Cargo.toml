[package]
name = "icenet-agent"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
tokio.workspace = true
tokio-util.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
bincode.workspace = true
reqwest.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
thiserror.workspace = true
libc.workspace = true

# Protocol and models
icenet-protocol = { path = "../shared/protocol" }
icenet-models = { path = "../shared/models" }

# Monitoring and detection
notify = "6.1"  # File system monitoring
sysinfo = "0.30"  # System information
crossbeam = "0.8"  # Concurrent data structures
dashmap = "5.5"  # Concurrent hashmap
sha2 = "0.10"  # Hashing
blake3 = "1.5"  # Fast hashing

# YARA integration (optional)
# yara = { version = "0.28", optional = true }

# Configuration
config = "0.13"
clap = { version = "4.4", features = ["derive"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1.6", features = ["v4", "serde"] }

# Utilities
hostname = "0.3"
whoami = "1.4"
sys-info = "0.9"

[target.'cfg(windows)'.dependencies]
windows.workspace = true
winapi.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation.workspace = true
mach2.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nix.workspace = true
inotify = "0.10"  # Linux file monitoring
procfs = "0.16"  # Linux process info

[[bin]]
name = "icenet-agent"
path = "src/main.rs"
